# Environment names the engine reads.
# A Rust string GENOS_* or OCC_* that is not listed here fails scripts/lint-env-mirrors.py.
# kind = mirror: a CLI argument exists and wins when both are set.
# kind = todo: read today, and still needs an argument. Do not add new todos.
# kind = override: a documented secondary of a non-CLI mechanism.
# kind = os / build: the operating system or Cargo, not an engine switch.
# kind = test: a harness variable, not a shipping switch.
# Date added: 2026-10-14.

