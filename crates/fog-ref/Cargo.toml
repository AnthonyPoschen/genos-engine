[package]
name = "genos-fog-ref"
version = "0.1.0"
edition = "2021"
publish = false
description = "CPU fog reference: path tracer, froxel light picks, and volumetric integration (ADR 0026 stages F0–F2)."

[lints]
workspace = true

# The plan keeps the comparison test beside the other debug tests; building it
# from this dependency-free crate lets it run headless with no GPU or Wayland.
[[test]]
name = "fog_reference"
path = "../debug/tests/fog_reference.rs"

[[test]]
name = "fog_froxel"
path = "../debug/tests/fog_froxel.rs"

[[test]]
name = "fog_integrate"
path = "../debug/tests/fog_integrate.rs"
