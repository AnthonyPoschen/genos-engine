# Thresholds for the lighting reference check. One file.
# A value inside human_band (a fraction) of a fail line, on either side,
# is "needs human". Borderline does not auto-pass.
# regress.* is how far a metric may worsen against the baseline build.

rel_floor = 0.02
# Dark pixels use max(Yr, this * mean(Yr), rel_floor). 0.25 still fails a
# missing bounce. It is not scaled by the reference noise and it is not
# raised for one scene. Room-a's blurred error of 0.134 needs a person.
rel_mean_frac = 0.25
dark_max = 0.05
unfilled_candidate_max = 0.004
unfilled_reference_min = 0.02
human_band = 0.15
disagree_delta = 0.008
noise_multiple = 2.0
# p99 and FLIP p99 sit wider than the mean noise.
noise_tail = 4.0
# Direct-only hall at 0d16c2b: ratio 1.016, blurred error 0.003, FLIP p99 0.84.
# The path tracer's primary ray and the renderer both take the pixel centre,
# and antialias is off, so that 0.84 is silhouette pixels in FLIP's edge term.
# flip_p99 at or under max(this, the noise ceiling) passes.
flip_edge = 0.90

fail.mean_rel = 0.08
fail.p99_rel = 0.35
fail.mean_rel_dark = 0.25
fail.flip_mean = 0.30
fail.flip_p99 = 0.55
fail.flicker = 0.04
fail.converge_1 = 0.30
fail.converge_2 = 0.22
fail.converge_4 = 0.16
fail.converge_8 = 0.10
fail.unfilled_share = 0.01
# The pass band starts at 0.102. Box-step at 4c6ca67e was 0.075 and 0.078.
# Room-a blurred error was 0.134, inside 0.102–0.138, so it needs a person.
# This line stays 0.12. Hall blur 0.303 and corner blur 0.204 stay past 0.138.
fail.blur_rel = 0.12
# |mean luminance ratio - 1|. 0.66, 0.80, and 1.18 fail. 1.03 passes.
fail.luma_delta = 0.10

regress.mean_rel = 0.015
regress.p99_rel = 0.04
regress.mean_rel_dark = 0.03
regress.flip_mean = 0.04
regress.flip_p99 = 0.06
regress.flicker = 0.01
regress.converge_1 = 0.04
regress.converge_2 = 0.03
regress.converge_4 = 0.025
regress.converge_8 = 0.02
regress.unfilled_share = 0.002
regress.blur_rel = 0.015
regress.luma_delta = 0.02
# Cold-start frames are not a picture-error line. A fresh renderer that does
# not cross the settle line within the run's settle cap is a renderer issue.
# Raising this number does not raise that cap.
fail.cold_frames = 180
regress.cold_frames = 180
