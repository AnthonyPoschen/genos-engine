name: lint

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: shader and Wayland tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc glslang-tools wayland-protocols libwayland-dev libxkbcommon-dev libvulkan-dev pkg-config
      - name: cargo-deny 0.20.2
        run: |
          curl -fsSL -o /tmp/cargo-deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-deny.tgz -C /tmp
          sudo install -m 755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - name: semgrep
        run: pip install semgrep
      - name: lint
        run: ./scripts/lint.sh

  quit-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wayland, Weston, and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc glslang-tools wayland-protocols libwayland-dev libxkbcommon-dev libvulkan-dev pkg-config mesa-vulkan-drivers weston
      - name: build the windowed binaries
        run: cargo build -p genos-camera -p genos-stress -p genos-lighting
      - name: quit gap under headless Weston
        run: cargo test -p genos-window --test lifecycle_quit -- --test-threads=1 --nocapture
