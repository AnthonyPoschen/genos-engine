[package]
name = "genos-stress"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[lib]
name = "genos_stress"
path = "src/lib.rs"

[[bin]]
name = "genos-stress"
path = "src/main.rs"

[features]
default = []
# Forwards to genos-render so a picture gate can compile the cache-fill knockout.
knockout = ["genos-render/knockout"]

[dependencies]
genos-input = { path = "../../crates/input" }
genos-lighting-ref = { path = "../../crates/lighting-ref" }
genos-load = { path = "../../crates/load" }
genos-debug = { path = "../../crates/debug" }
genos-mcp = { path = "../../crates/mcp" }
genos-scene = { path = "../../crates/scene" }
genos-window = { path = "../../crates/window" }
genos-render = { path = "../../crates/render" }
genos-ui = { path = "../../crates/ui" }
